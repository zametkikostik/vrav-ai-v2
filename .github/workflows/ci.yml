name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -e ".[dev]"
          pip install ollama pydantic
      - name: Unit tests
        run: python -m pytest tests/ -q
      - name: Syntax check
        run: |
          python -m compileall -q core memory channels main.py config.py
